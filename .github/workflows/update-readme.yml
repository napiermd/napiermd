name: Update README

on:
  schedule:
    # Every Monday at 7:00 AM UTC (midnight Pacific)
    - cron: "0 7 * * 1"
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push README changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: napiermd
          BLOG_URL: https://napiermd.me
        run: python scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "No changes to commit." || (
            git add README.md &&
            git commit -m "chore: auto-update README [skip ci]" &&
            git push
          )
